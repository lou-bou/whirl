# Builds the signed Whirl APK and attaches it to a GitHub release.
# Runs when a tag like mobile-v1.0.0 is pushed:
#
#   git tag mobile-v1.0.0 && git push origin mobile-v1.0.0
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   MOBILE_KEYSTORE_BASE64    the output of: base64 -w0 mobile/keys/release.jks
#   MOBILE_KEYSTORE_PASSWORD  the storePassword line of mobile/keys/key.properties
# (the same key and values as Nook's, Cairn's and Tack's: all my apps share the lou-apps key)
name: Mobile release

on:
  push:
    tags: ['mobile-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Version from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#mobile-v}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the MOBILE_KEYSTORE_BASE64 and MOBILE_KEYSTORE_PASSWORD secrets first."
            exit 1
          fi
          mkdir -p mobile/keys
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/keys/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=lou-apps"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > mobile/keys/key.properties

      # The app's tests run against a Dart fake of the server, held to what server/index.js
      # answers. Record the real server again (on a throwaway Postgres); if it answers
      # differently now, stop here.
      - name: The fake server still matches server/index.js
        run: |
          npm ci
          npm ci --prefix mobile/whirl/tool
          node mobile/whirl/tool/record_server.mjs
          git diff --exit-code mobile/whirl/test/server_recording.json || {
            echo "::error::server/index.js answers differently: run 'node mobile/whirl/tool/record_server.mjs', update test/fake_server.dart until fake_server_test passes, and commit."
            exit 1
          }

      - name: Analyze and test the shared package
        working-directory: mobile/packages/kit
        run: flutter pub get && flutter analyze && flutter test

      - name: Analyze and test Whirl
        working-directory: mobile/whirl
        run: flutter pub get && flutter analyze && flutter test

      - name: Build the APK
        working-directory: mobile/whirl
        # The build number must grow with every release or Android refuses the update.
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "$((GITHUB_RUN_NUMBER + 1))"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/whirl-${{ steps.version.outputs.name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Whirl mobile ${{ steps.version.outputs.name }}
          files: whirl-${{ steps.version.outputs.name }}.apk
          body: Open this page on the phone and tap the APK to install or update.
